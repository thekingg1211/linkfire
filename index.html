<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#2f6bff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f3f5fb;--bg2:#dfe7ff;--card:#fff;--text:#141824;--muted:#667089;--line:#e1e6f2;--accent:#2f6bff;--accent2:#8a4dff;--shadow:0 6px 24px rgba(30,50,110,.08);--chip:#eef2ff;--bad:#e04646;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e15;--bg2:#161d3d;--card:#161b27;--text:#eef1f8;--muted:#9aa4bb;--line:#252c3d;--accent:#5b8cff;--accent2:#a37bff;--shadow:0 8px 28px rgba(0,0,0,.45);--chip:#1d2540;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0e15;--bg2:#161d3d;--card:#161b27;--text:#eef1f8;--muted:#9aa4bb;--line:#252c3d;--accent:#5b8cff;--accent2:#a37bff;--shadow:0 8px 28px rgba(0,0,0,.45);--chip:#1d2540;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(900px 340px at 50% -80px,var(--bg2),transparent) no-repeat;color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}h1{font-size:24px;margin:0;letter-spacing:-.4px}
h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sq{width:44px;height:44px;border-radius:14px;padding:0;font-size:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--text)}
.sub{color:var(--muted);margin:10px 0 14px;font-size:14.5px}
.hello{font-size:13px;background:var(--chip);border-radius:12px;padding:8px 12px;margin-bottom:12px;color:var(--muted)}
.search{position:relative}.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.7;pointer-events:none}
input,select{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;box-shadow:var(--shadow)}
.search input{padding-left:44px}input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;transition:transform .12s,filter .2s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}button:disabled{opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:14px;font-weight:500;box-shadow:none}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row select{padding:10px 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
details.add summary{cursor:pointer;font-weight:600;list-style:none}details.add summary::-webkit-details-marker{display:none}
.form{display:grid;gap:10px;margin-top:12px}.msg{font-size:13px;color:var(--muted);min-height:18px}.msg.err{color:var(--bad)}
.bar{margin:14px 4px 0;color:var(--muted);font-size:13px}
.item{display:flex;gap:12px;align-items:center;animation:in .25s ease both}.item:hover{border-color:var(--accent)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ico{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--chip)}
.info{min-width:0;flex:1}.t{font-weight:600;overflow-wrap:anywhere;line-height:1.3}.m{font-size:12px;color:var(--muted);margin-top:3px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{padding:6px 10px;font-size:12.5px;border-radius:10px;background:var(--chip);color:var(--text);font-weight:500}
.dl{flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;font-weight:600;padding:11px 15px;border-radius:13px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:36px 8px}.empty b{display:block;font-size:34px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#141824;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
.av{width:44px;height:44px;border-radius:14px;overflow:hidden;display:grid;place-items:center;font-size:20px}.av img{width:100%;height:100%;object-fit:cover}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:16px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.pf{display:flex;gap:14px;align-items:center}.pf .big{width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--chip);display:grid;place-items:center;font-size:34px;flex:none}.pf .big img{width:100%;height:100%;object-fit:cover}
.pf>div{flex:1;display:grid;gap:8px}.ghost{background:var(--chip);color:var(--text)}
@media (max-width:420px){.item{flex-wrap:wrap}.dl{width:100%;text-align:center}}
.logo{width:44px;height:44px;border-radius:13px;box-shadow:0 6px 18px rgba(80,90,255,.35)}
.pa{width:18px;height:18px;border-radius:50%;object-fit:cover;margin-right:6px}.pub{display:flex;align-items:center;font-size:12.5px;margin-top:4px}.opt{width:100%;margin-top:8px;text-align:left}.sheet textarea,.sheet .fld{margin-top:8px}
.ico{overflow:hidden}.ico.has{width:64px;height:64px}.ci{width:100%;height:100%;object-fit:cover}#lprev{width:72px;height:72px;border-radius:12px;object-fit:cover}
.gbtn{width:100%;background:#fff;color:#222;border:1px solid var(--line)}.who{font-size:14px;color:var(--muted);margin-bottom:8px;overflow-wrap:anywhere}
.stars{display:inline-block;font-size:22px;letter-spacing:2px;line-height:1;background:linear-gradient(90deg,#f5b301 var(--p,0%),#aab3c8 var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none;-webkit-user-select:none;vertical-align:middle}
.stars.sm{font-size:14px;letter-spacing:1px}.stars.inp{font-size:34px;letter-spacing:4px;cursor:pointer;touch-action:none}
.rt{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:4px;color:var(--muted)}.rt b{color:var(--text)}
.mt{color:var(--muted);font-size:13px}#rs-sum,#rs-my{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.cm{padding:10px 0;border-top:1px solid var(--line)}.cm p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.ch{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
#rs-t{width:100%;min-height:70px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;resize:vertical}
.item{cursor:pointer}.go{flex:none;font-size:26px;color:var(--muted);line-height:1}[dir=rtl] .go{transform:scaleX(-1)}
.pdet{display:flex;gap:12px;align-items:center;margin-bottom:12px}.bigdl{display:block;text-align:center;padding:14px;font-size:16px;width:100%}
.pc main{max-width:1100px}.pc #list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pc #list .card{margin:0}.pc #list .empty{grid-column:1/-1}
.pc .chips{flex-wrap:wrap;overflow:visible}.pc .ov{align-items:center}.pc .sheet{border-radius:22px;max-width:640px}
</style>
</head>

<main>
 <div class="top">
  <div class="brand"><img class="logo" src="icons/logo.svg" alt=""><h1>Link<span>Fire</span></h1></div>

      <div class="pf"><label><input id="limg" type="file" accept="image/*" hidden><span class="mini ghost" style="display:inline-block;padding:10px 12px;cursor:pointer" data-i="limg"></span></label><img id="lprev" alt="" hidden></div><select id="cat"></select><button id="send" data-i="send"></button><div class="msg" id="msg"></div></div>

</main>
<div class="ov" id="ov"><div class="sheet">
 <h2><span data-i="set"></span><button class="sq" id="x" style="width:38px;height:38px;font-size:16px">✕</button></h2>
 <h3 data-i="acct"></h3><div id="auth"></div>
 <h3 data-i="prof"></h3>
 <div class="pf"><div class="big" id="big">👤</div><div><input id="nick" maxlength="24" data-ph="nick"><label><input id="photo" type="file" accept="image/*" hidden><span class="mini ghost" style="display:inline-block;padding:10px 12px;cursor:pointer" data-i="photo"></span></label></div></div>
 <button id="savep" style="width:100%;margin-top:12px" data-i="savep"></button><div class="msg" id="pmsg"></div>
 <h3 data-i="theme"></h3><select id="th"></select>
 <h3 data-i="lang"></h3><select id="lg"></select>
</div></div>
<div class="ov" id="ov2"><div class="sheet" id="sh2"></div></div>
<div class="toast" id="toast"></div>

const BAD=/\b(porn\w*|xxx|nsfw|hentai|onlyfans|nudes?|sexo|sex|sexy|erotic\w*|erotico|adult\w*|putaria|safada|pelada|keylogger|ransomware|stealer|trojan|botnet|ddos|hacktool)\b/i;
const RISKY=/\.(exe|scr|bat|cmd|vbs|msi|ps1|com|jar\.exe)$/i;
const blocked=(t,u)=>{let x=t||'';try{x+=' '+decodeURIComponent(u||'').replace(/[_+.\-\/]/g,' ')}catch(e){}return BAD.test(x)||x.indexOf('18+')>-1||x.indexOf('+18')>-1||RISKY.test((t||'').trim())||RISKY.test(((u||'').split('?')[0]))};
const catOf=r=>(r.cat&&ICON[r.cat])?r.cat:guess(r.title||'');
const cl=k=>(ICON[k]||'🔥')+' '+T('c_'+k);
/* idioma */
const opts=a=>a.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('');
const keepSel=(id,h)=>{const e=$(id),v=e.value;e.innerHTML=h;if(v)e.value=v};
function applyLang(){
 root.lang=lang;root.dir=lang==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T(e.dataset.ph));
 $('chips').innerHTML=CK.map(k=>'<button class="chip'+(k===cat?' on':'')+'" data-c="'+k+'">'+cl(k)+'</button>').join('');
 keepSel('cat','<option value="auto">'+T('auto')+'</option>'+opts(CK.slice(1).map(k=>[k,cl(k)])));
 keepSel('sort',opts([['new',T('s_new')],['pop',T('s_pop')]]));
 keepSel('view',opts([['all',T('v_all')],['fav',T('v_fav')],['mine',T('v_mine')]]));
 keepSel('th',opts([['sys',T('sys')],['light',T('light')],['dark',T('dark')]]));$('th').value=pref;
 $('lg').innerHTML=Object.keys(L).sort((a,b)=>L[a].n.localeCompare(L[b].n)).map(k=>'<option value="'+k+'">'+L[k].n+'</option>').join('');$('lg').value=lang;
 authUI();greet();render()}
const dispName=()=>prof.nick||(me&&me.displayName?me.displayName.split(' ')[0]:'');
function greet(){const h=$('hello'),n=dispName();if(me&&n){h.hidden=false;h.textContent='👋 '+T('hi').replace('{n}',n)}else h.hidden=true}
function avatar(){const src=prof.photo||(me&&me.photoURL)||'';const h=src?'<img alt="" referrerpolicy="no-referrer" src="'+esc(src)+'">':'👤';$('acc').innerHTML=h;$('big').innerHTML=h}
function authUI(){const a=$('auth');
 if(me){a.innerHTML='<div class="who">'+esc(T('who').replace('{n}',me.email||dispName()))+'</div><button class="ghost" id="outb" style="width:100%">'+T('out')+'</button>';$('outb').onclick=()=>signOut(auth)}
 else{a.innerHTML='<button class="gbtn" id="glb">'+T('gl')+'</button>';$('glb').onclick=login}}
async function login(){if(!auth){toast(T('cfg'));return}
 const p=new GoogleAuthProvider();
 try{await signInWithPopup(auth,p)}catch(e){
  if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request'||e.code==='auth/operation-not-supported-in-this-environment')){try{await signInWithRedirect(auth,p)}catch(x){toast(T('lerr'))}}
  else if(!e||e.code!=='auth/popup-closed-by-user')toast(T('lerr'))}}
/* lista */
function render(){
 const q=$('q').value.trim().toLowerCase(),v=$('view').value,pop=$('sort').value==='pop',box=$('list');
 if(!col){box.innerHTML='<div class="empty"><b>⚙️</b>'+T('cfg')+'</div>';$('count').textContent='';return}
 if(!ready){box.innerHTML='<div class="empty"><b>⏳</b></div>';return}
 const list=rows.filter(r=>{
  if((r.reports||0)>=3||blocked(r.title,r.url))return false;
  if(!isPC&&PCK.includes(catOf(r)))return false;
  if(cat!=='all'&&catOf(r)!==cat)return false;
  if(v==='fav'&&!favs.includes(r.id))return false;
  if(v==='mine'&&(!uid()||r.uid!==uid()))return false;
  return !q||(r.title+' '+r.url).toLowerCase().includes(q)});
 list.sort((a,b)=>pop?((b.downloads||0)-(a.downloads||0))||((b.createdAt||0)-(a.createdAt||0)):(b.createdAt||0)-(a.createdAt||0));
 $('count').textContent=list.length+' '+(list.length===1?T('f1'):T('fn'));
 if(!list.length){box.innerHTML='<div class="empty"><b>'+(rows.length?'🔍':'🌱')+'</b>'+(rows.length?T('none'):T('first'))+'</div>';return}
 box.innerHTML=list.map(r=>{
  const c=catOf(r),d=r.createdAt?new Date(r.createdAt).toLocaleDateString(lang):'';
  return '<div class="card item" data-id="'+r.id+'" role="button" tabindex="0"><div class="ico'+(r.img?' has':'')+'">'+(r.img?'<img class="ci" alt="" src="'+esc(r.img)+'">':ICON[c])+'</div><div class="info"><div class="t">'+esc(r.title)+'</div><div class="m">'+T('c_'+c)+' · ⬇ '+(r.downloads||0)+(d?' · '+d:'')+'</div>'+starsLine(r.id)+pubLine(r)+'</div><span class="go">›</span></div>'}).join('')}
$('chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render()};

let limgData=null;
const shrink=(f,n)=>new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,n,n);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>res(null);im.src=u});
$('limg').onchange=async function(){const f=this.files&&this.files[0];if(!f)return;limgData=await shrink(f,128);const p=$('lprev');if(limgData){p.src=limgData;p.hidden=false}};
const sh=h=>{if(offC){offC();offC=null}curR=null;drag=false;$('sh2').innerHTML=h;$('ov2').classList.add('on')};
const shClose=()=>{if(offC){offC();offC=null}curR=null;drag=false;$('ov2').classList.remove('on')};
$('ov2').onclick=e=>{if(e.target===$('ov2'))shClose()};
function openReport(r){
 if(!me){toast(T('nologin'));return}
 sh('<h2><span>'+T('rtitle')+'</span></h2>'+[['adulto','r1'],['perigo','r2'],['quebrado','r3'],['outro','r4']].map(x=>'<button class="mini opt" data-r="'+x[0]+'">'+T(x[1])+'</button>').join('')+'<button class="mini opt ghost" id="rc">'+T('cancel')+'</button>');
 $('rc').onclick=shClose;
 $('sh2').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{
  shClose();
  try{await setDoc(doc(db,'reports',r.id+'_'+me.uid),{linkId:r.id,uid:me.uid,reason:b.dataset.r,createdAt:Date.now()});
   await updateDoc(doc(db,'links',r.id),{reports:increment(1)});toast(T('reps'))}
  catch(e){toast(T('rdup'))}})}
function openEdit(r){
 sh('<h2><span>'+T('etitle')+'</span></h2><input id="et" class="fld" maxlength="120"><select id="ec" class="fld">'+opts(CK.slice(1).map(k=>[k,cl(k)]))+'</select><label class="fld" style="display:block"><input id="ei" type="file" accept="image/*" hidden><span class="mini ghost" style="display:inline-block;padding:10px 12px;cursor:pointer">'+T('limg')+'</span></label><button class="mini opt ghost" id="eri">'+T('rimg')+'</button><button id="es" class="opt" style="margin-top:12px">'+T('savee')+'</button><button class="mini opt ghost" id="ex">'+T('cancel')+'</button>');
 let eimg;$('ei').onchange=async function(){const f=this.files&&this.files[0];if(f){eimg=await shrink(f,128);toast('📷 ✓')}};$('eri').onclick=()=>{eimg=null;toast('✓')};$('et').value=r.title;$('ec').value=catOf(r);$('ex').onclick=shClose;
 $('es').onclick=async()=>{const t=$('et').value.trim().slice(0,120);if(!t)return;
  if(blocked(t,r.url)){toast(T('blk'));return}
  try{await updateDoc(doc(db,'links',r.id),{title:t,cat:$('ec').value,...(eimg!==undefined?{img:eimg}:{})});shClose();toast(T('upd'))}catch(e){toast(T('err'))}}}
/* avaliações e comentários */
const fmtN=n=>String(n).replace('.',',');
const starsEl=(v,c)=>'<span class="stars '+(c||'')+'" style="--p:'+(v/5*100)+'%">★★★★★</span>';
function starsLine(id){const a=RT[id];if(!a||!a.n)return '<div class="rt">'+starsEl(0,'sm')+'<span>'+T('norate')+'</span></div>';const m=a.s/a.n;return '<div class="rt">'+starsEl(m,'sm')+'<b>'+fmtN(m.toFixed(1))+'</b><span>('+a.n+')</span></div>'}
function drawRate(){
 const r=curR;if(!r||!$('rs-sum'))return;
 const a=RT[r.id];
 $('rs-sum').innerHTML=(a&&a.n)?starsEl(a.s/a.n)+'<b>'+fmtN((a.s/a.n).toFixed(1))+'</b><span class="mt">('+a.n+' '+T(a.n===1?'rt1':'rtn')+')</span>':'<span class="mt">'+T('norate')+'</span>';
 const box=$('rs-my');
 if(!me){box.innerHTML='<span class="mt">'+T('signrate')+'</span>'}
 else if(!drag){
  const my=RB[r.id+'_'+me.uid]||0,ref=doc(db,'ratings',r.id+'_'+me.uid);
  box.innerHTML='<span class="mt">'+T('yours')+'</span>'+starsEl(my,'inp')+'<span id="rs-v" class="mt">'+(my?fmtN(my):'')+'</span>'+(my?'<button class="mini" id="rs-d">'+T('rm')+'</button>':'');
  const inp=box.querySelector('.inp'),lab=$('rs-v');
  const calc=e=>{const b=inp.getBoundingClientRect(),x=Math.min(Math.max(e.clientX-b.left,0),b.width);return Math.max(.5,Math.ceil(x/b.width*10)/2)};
  const pv=v=>{inp.style.setProperty('--p',(v/5*100)+'%');lab.textContent=fmtN(v)};
  inp.onpointerdown=e=>{drag=true;try{inp.setPointerCapture(e.pointerId)}catch(x){}pv(calc(e))};
  inp.onpointermove=e=>{if(drag)pv(calc(e))};
  inp.onpointerup=e=>{if(!drag)return;drag=false;const v=calc(e);setDoc(ref,{linkId:r.id,uid:me.uid,nota:v,createdAt:Date.now()}).catch(()=>{toast(T('err'));drawRate()})};
  inp.onpointercancel=()=>{drag=false;pv(my)};
  const d=$('rs-d');if(d)d.onclick=()=>deleteDoc(ref).catch(()=>toast(T('err')));
 }
 $('rs-l').innerHTML=cm.length?cm.map(c=>{
  const n=RB[c.linkId+'_'+c.uid],d=c.createdAt?new Date(c.createdAt).toLocaleDateString(lang):'',ph=/^(https:|data:image\/)/.test(c.photo||'')?'<img class="pa" alt="" referrerpolicy="no-referrer" src="'+esc(c.photo)+'">':'';
  return '<div class="cm"><div class="ch">'+ph+'<b>'+esc(c.nome||'')+'</b>'+(n?starsEl(n,'sm'):'')+'<span class="mt">'+d+'</span></div><p>'+esc(c.texto||'')+'</p>'+((me&&c.uid===me.uid)?'<button class="mini" data-cd="'+esc(c.id)+'">'+T('del')+'</button>':'')+'</div>'}).join(''):'<div class="mt" style="padding:10px 0">'+T('nocomm')+'</div>';
 $('rs-l').querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>deleteDoc(doc(db,'comments',b.dataset.cd)).catch(()=>toast(T('err'))));
}
const pubLine=r=>(r.nick||r.photo)?'<div class="pub">'+(r.photo?'<img class="pa" alt="" referrerpolicy="no-referrer" src="'+esc(r.photo)+'">':'')+esc(r.nick||'')+'</div>':'';
async function act(a,r){
 if(!r||!db)return;
 try{
  if(a==='dl'){await updateDoc(doc(db,'links',r.id),{downloads:increment(1)})}
  else if(a==='copy'){try{await navigator.clipboard.writeText(r.url)}catch(x){const t=document.createElement('textarea');t.value=r.url;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast(T('copied'))}
  else if(a==='rep'){openReport(r)}
  else if(a==='edit'){openEdit(r)}
  else if(a==='del'){if(!confirm(T('qdel')))return;await deleteDoc(doc(db,'links',r.id));shClose();toast(T('dels'))}
  else if(a==='fav'){if(!me){toast(T('nologin'));return}
   favs=favs.includes(r.id)?favs.filter(x=>x!==r.id):favs.concat(r.id);render();
   const fb=$('pf');if(fb)fb.textContent=favs.includes(r.id)?T('faved'):T('fav');
   await setDoc(doc(db,'users',me.uid),{favs},{merge:true})}
 }catch(x){toast(T('err'))}
}
function openPost(r){
 if(!db)return;
 const c=catOf(r),d=r.createdAt?new Date(r.createdAt).toLocaleDateString(lang):'',mine=uid()&&r.uid===uid(),f=favs.includes(r.id);
 sh('<h2><span style="overflow-wrap:anywhere">'+esc(r.title)+'</span><button class="sq" id="rx" style="width:38px;height:38px;font-size:16px;flex:none">✕</button></h2>'
 +'<div class="pdet"><div class="ico'+(r.img?' has':'')+'">'+(r.img?'<img class="ci" alt="" src="'+esc(r.img)+'">':ICON[c])+'</div><div class="info"><div class="m" style="margin:0">'+T('c_'+c)+' · ⬇ '+(r.downloads||0)+(d?' · '+d:'')+'</div>'+pubLine(r)+'</div></div>'
 +'<a class="dl bigdl" data-a="dl" href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">'+T('dl')+'</a>'
 +'<div class="acts" style="margin-top:10px"><button class="mini" id="pf" data-a="fav">'+(f?T('faved'):T('fav'))+'</button><button class="mini" data-a="copy">'+T('copy')+'</button><button class="mini" data-a="rep">'+T('rep')+'</button>'+(mine?'<button class="mini" data-a="edit">'+T('edit')+'</button><button class="mini" data-a="del">'+T('del')+'</button>':'')+'</div>'
 +'<div id="rs-sum"></div><div id="rs-my"></div><h3>'+T('comm')+'</h3><textarea id="rs-t" maxlength="500" placeholder="'+esc(T('writec'))+'"></textarea><button id="rs-s" class="opt" style="margin-top:8px;text-align:center">'+T('sendc')+'</button><div id="rs-l"></div>');
 curR=r;cm=[];drag=false;
 $('rx').onclick=shClose;
 $('rs-s').onclick=async()=>{
  if(!me){toast(T('nologin'));return}
  const t=$('rs-t').value.trim().slice(0,500);if(!t)return;
  if(blocked(t,'')){toast(T('cblk'));return}
  const b=$('rs-s');b.disabled=true;
  try{await addDoc(collection(db,'comments'),{linkId:r.id,uid:me.uid,nome:dispName()||'?',photo:prof.photo||me.photoURL||null,texto:t,createdAt:Date.now()});$('rs-t').value=''}
  catch(e){toast(T('err'))}
  b.disabled=false};
 offC=onSnapshot(query(collection(db,'comments'),where('linkId','==',r.id),limit(200)),s=>{cm=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));drawRate()},()=>{});
 drawRate()}
$('sh2').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&curR)act(b.dataset.a,curR)});
$('list').addEventListener('click',e=>{const it=e.target.closest('.item');if(!it)return;const r=rows.find(x=>x.id===it.dataset.id);if(r)openPost(r)});
$('list').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const it=e.target.closest('.item');if(!it)return;const r=rows.find(x=>x.id===it.dataset.id);if(r)openPost(r)});
$('q').oninput=render;$('sort').onchange=render;$('view').onchange=render;
$('send').onclick=async()=>{
 const u=$('url').value.trim(),t=$('title').value.trim();
 if(!me){say(T('nologin'),true);$('ov').classList.add('on');return}
 if(!validMF(u)){say(T('bad'),true);return}
 if(t.length<2){say(T('needname'),true);$('title').focus();return}
 if(blocked(t,u)){say(T('blk'),true);return}
 if(!col){say(T('cfg'),true);return}
 if(rows.some(r=>r.url===u)){say(T('dup'),true);return}
 const title=(t||nameFromUrl(u)).slice(0,120);if(blocked(title,u)){say(T('blk'),true);return}
 let c=$('cat').value;if(c==='auto')c=guess(title);if(!isPC&&PCK.includes(c))c='outros';
 $('send').disabled=true;
 try{await addDoc(col,{url:u,title,cat:c,downloads:0,reports:0,uid:uid(),nick:dispName()||null,photo:prof.photo||(me&&me.photoURL)||null,img:limgData||null,createdAt:Date.now()});
  $('url').value='';$('title').value='';limgData=null;$('limg').value='';$('lprev').hidden=true;say(T('ok'));$('addBox').open=false}
 catch(e){say(T('err'),true)}
 $('send').disabled=false};
/* configurações */
$('acc').onclick=()=>{$('nick').value=prof.nick||'';$('pmsg').textContent='';authUI();$('ov').classList.add('on')};
$('x').onclick=()=>$('ov').classList.remove('on');
$('ov').onclick=e=>{if(e.target===$('ov'))$('ov').classList.remove('on')};
$('th').onchange=()=>{pref=$('th').value;try{localStorage.setItem('lf-theme',pref)}catch(e){}applyTheme()};
$('lg').onchange=()=>{lang=$('lg').value;try{localStorage.setItem('lf-lang',lang)}catch(e){}applyLang()};
$('photo').onchange=function(){
 const f=this.files&&this.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=112;
  c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,112,112);prof.photo=c.toDataURL('image/jpeg',.75);URL.revokeObjectURL(u);avatar()};
 im.src=u};
$('savep').onclick=async()=>{
 if(!me){$('pmsg').textContent=T('nologin');return}
 prof.nick=$('nick').value.trim().slice(0,24);
 try{await setDoc(doc(db,'users',me.uid),{nick:prof.nick,photo:prof.photo||null},{merge:true});rows.filter(x=>x.uid===me.uid).forEach(x=>updateDoc(doc(db,'links',x.id),{nick:prof.nick||null,photo:prof.photo||(me.photoURL)||null}).catch(()=>{}));$('pmsg').textContent=T('psaved');greet();avatar()}
 catch(e){$('pmsg').textContent=T('err')}};
/* modo computador / celular */
let rzT=null;
function setMode(){const n=calcPC();if(n===isPC)return;isPC=n;root.classList.toggle('pc',n);CK=n?CK0.concat(PCK):CK0.slice();if(!n&&PCK.includes(cat))cat='all';shClose();applyLang()}
addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(setMode,200)});
/* iniciar */
applyLang();
if(firebaseConfig.apiKey&&firebaseConfig.apiKey!=='COLE_AQUI'){
 const app=initializeApp(firebaseConfig);db=getFirestore(app);auth=getAuth(app);col=collection(db,'links');
 onSnapshot(query(col,orderBy('createdAt','desc'),limit(500)),s=>{
  rows=s.docs.map(d=>({...d.data(),id:d.id})).filter(r=>r.url&&validMF(r.url));ready=true;render()},()=>{ready=true;render()});
 onSnapshot(collection(db,'ratings'),s=>{RT={};RB={};s.docs.forEach(d=>{const x=d.data();if(!x.linkId||typeof x.nota!=='number')return;RB[d.id]=x.nota;const a=RT[x.linkId]=RT[x.linkId]||{s:0,n:0};a.s+=x.nota;a.n++});render();if(curR)drawRate()},()=>{});
 onAuthStateChanged(auth,async u=>{
  me=u;favs=[];prof={};
  if(u){try{const d=await getDoc(doc(db,'users',u.uid));const x=d.exists()?d.data():{};favs=x.favs||[];prof={nick:x.nick||'',photo:x.photo||null}}catch(e){}}
  avatar();authUI();greet();render();if(curR)drawRate()});
}
avatar();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
