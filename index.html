<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LinkFire</title>
<meta name="theme-color" content="#2f6bff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f3f5fb;--bg2:#dfe7ff;--card:#fff;--text:#141824;--muted:#667089;--line:#e1e6f2;--accent:#2f6bff;--accent2:#8a4dff;--shadow:0 6px 24px rgba(30,50,110,.08);--chip:#eef2ff;--bad:#e04646;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e15;--bg2:#161d3d;--card:#161b27;--text:#eef1f8;--muted:#9aa4bb;--line:#252c3d;--accent:#5b8cff;--accent2:#a37bff;--shadow:0 8px 28px rgba(0,0,0,.45);--chip:#1d2540;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0e15;--bg2:#161d3d;--card:#161b27;--text:#eef1f8;--muted:#9aa4bb;--line:#252c3d;--accent:#5b8cff;--accent2:#a37bff;--shadow:0 8px 28px rgba(0,0,0,.45);--chip:#1d2540;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(900px 340px at 50% -80px,var(--bg2),transparent) no-repeat;color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}h1{font-size:24px;margin:0;letter-spacing:-.4px}
h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sq{width:44px;height:44px;border-radius:14px;padding:0;font-size:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--text)}
.sub{color:var(--muted);margin:10px 0 14px;font-size:14.5px}
.hello{font-size:13px;background:var(--chip);border-radius:12px;padding:8px 12px;margin-bottom:12px;color:var(--muted)}
.search{position:relative}.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.7;pointer-events:none}
input,select{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;box-shadow:var(--shadow)}
.search input{padding-left:44px}input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;transition:transform .12s,filter .2s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}button:disabled{opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:14px;font-weight:500;box-shadow:none}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row select{padding:10px 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
details.add summary{cursor:pointer;font-weight:600;list-style:none}details.add summary::-webkit-details-marker{display:none}
.form{display:grid;gap:10px;margin-top:12px}.msg{font-size:13px;color:var(--muted);min-height:18px}.msg.err{color:var(--bad)}
.bar{margin:14px 4px 0;color:var(--muted);font-size:13px}
.item{display:flex;gap:12px;align-items:center;animation:in .25s ease both}.item:hover{border-color:var(--accent)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ico{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--chip)}
.info{min-width:0;flex:1}.t{font-weight:600;overflow-wrap:anywhere;line-height:1.3}.m{font-size:12px;color:var(--muted);margin-top:3px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{padding:6px 10px;font-size:12.5px;border-radius:10px;background:var(--chip);color:var(--text);font-weight:500}
.dl{flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;font-weight:600;padding:11px 15px;border-radius:13px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:36px 8px}.empty b{display:block;font-size:34px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#141824;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
.av{width:44px;height:44px;border-radius:14px;overflow:hidden;display:grid;place-items:center;font-size:20px}.av img{width:100%;height:100%;object-fit:cover}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:16px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.pf{display:flex;gap:14px;align-items:center}.pf .big{width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--chip);display:grid;place-items:center;font-size:34px;flex:none}.pf .big img{width:100%;height:100%;object-fit:cover}
.pf>div{flex:1;display:grid;gap:8px}.ghost{background:var(--chip);color:var(--text)}
@media (max-width:420px){.item{flex-wrap:wrap}.dl{width:100%;text-align:center}}
.logo{width:44px;height:44px;border-radius:13px;box-shadow:0 6px 18px rgba(80,90,255,.35)}
.gbtn{width:100%;background:#fff;color:#222;border:1px solid var(--line)}.who{font-size:14px;color:var(--muted);margin-bottom:8px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
 <div class="top">
  <div class="brand"><img class="logo" src="icons/logo.svg" alt=""><h1>Link<span>Fire</span></h1></div>
  <button class="sq av" id="acc" aria-label="Account">👤</button>
 </div>
 <p class="sub" data-i="sub"></p>
 <div class="hello" id="hello" hidden></div>
 <div class="search"><span>🔎</span><input id="q" type="search" data-ph="search" autocomplete="off"></div>
 <div class="chips" id="chips"></div>
 <div class="row"><select id="sort"></select><select id="view"></select></div>
 <details class="card add" id="addBox"><summary data-i="add"></summary>
  <div class="form"><input id="url" type="url" data-ph="urlph"><input id="title" type="text" data-ph="titleph" maxlength="120"><select id="cat"></select><button id="send" data-i="send"></button><div class="msg" id="msg"></div></div>
 </details>
 <div class="bar" id="count"></div>
 <div id="list"><div class="empty"><b>⏳</b></div></div>
</main>
<div class="ov" id="ov"><div class="sheet">
 <h2><span data-i="set"></span><button class="sq" id="x" style="width:38px;height:38px;font-size:16px">✕</button></h2>
 <h3 data-i="acct"></h3><div id="auth"></div>
 <h3 data-i="prof"></h3>
 <div class="pf"><div class="big" id="big">👤</div><div><input id="nick" maxlength="24" data-ph="nick"><label><input id="photo" type="file" accept="image/*" hidden><span class="mini ghost" style="display:inline-block;padding:10px 12px;cursor:pointer" data-i="photo"></span></label></div></div>
 <button id="savep" style="width:100%;margin-top:12px" data-i="savep"></button><div class="msg" id="pmsg"></div>
 <h3 data-i="theme"></h3><select id="th"></select>
 <h3 data-i="lang"></h3><select id="lg"></select>
</div></div>
<div class="toast" id="toast"></div>

const dispName=()=>prof.nick||(me&&me.displayName?me.displayName.split(' ')[0]:'');
function greet(){const h=$('hello'),n=dispName();if(me&&n){h.hidden=false;h.textContent='👋 '+T('hi').replace('{n}',n)}else h.hidden=true}
function avatar(){const src=prof.photo||(me&&me.photoURL)||'';const h=src?'<img alt="" referrerpolicy="no-referrer" src="'+esc(src)+'">':'👤';$('acc').innerHTML=h;$('big').innerHTML=h}
function authUI(){const a=$('auth');
 if(me){a.innerHTML='<div class="who">'+esc(T('who').replace('{n}',me.email||dispName()))+'</div><button class="ghost" id="outb" style="width:100%">'+T('out')+'</button>';$('outb').onclick=()=>signOut(auth)}
 else{a.innerHTML='<button class="gbtn" id="glb">'+T('gl')+'</button>';$('glb').onclick=login}}
async function login(){if(!auth){toast(T('cfg'));return}
 const p=new GoogleAuthProvider();
 try{await signInWithPopup(auth,p)}catch(e){
  if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request'||e.code==='auth/operation-not-supported-in-this-environment')){try{await signInWithRedirect(auth,p)}catch(x){toast(T('lerr'))}}
  else if(!e||e.code!=='auth/popup-closed-by-user')toast(T('lerr'))}}
/* lista */
function render(){
 const q=$('q').value.trim().toLowerCase(),v=$('view').value,pop=$('sort').value==='pop',box=$('list');
 if(!col){box.innerHTML='<div class="empty"><b>⚙️</b>'+T('cfg')+'</div>';$('count').textContent='';return}
 if(!ready){box.innerHTML='<div class="empty"><b>⏳</b></div>';return}
 const list=rows.filter(r=>{
  if((r.reports||0)>=3)return false;
  if(cat!=='all'&&catOf(r)!==cat)return false;
  if(v==='fav'&&!favs.includes(r.id))return false;
  if(v==='mine'&&(!uid()||r.uid!==uid()))return false;
  return !q||(r.title+' '+r.url).toLowerCase().includes(q)});
 list.sort((a,b)=>pop?((b.downloads||0)-(a.downloads||0))||((b.createdAt||0)-(a.createdAt||0)):(b.createdAt||0)-(a.createdAt||0));
 $('count').textContent=list.length+' '+(list.length===1?T('f1'):T('fn'));
 if(!list.length){box.innerHTML='<div class="empty"><b>'+(rows.length?'🔍':'🌱')+'</b>'+(rows.length?T('none'):T('first'))+'</div>';return}
 box.innerHTML=list.map(r=>{
  const c=catOf(r),d=r.createdAt?new Date(r.createdAt).toLocaleDateString(lang):'',f=favs.includes(r.id),
  del=(uid()&&r.uid===uid())?'<button class="mini" data-a="del" data-id="'+r.id+'">'+T('del')+'</button>':'';
  return '<div class="card item"><div class="ico">'+ICON[c]+'</div><div class="info"><div class="t">'+esc(r.title)+'</div><div class="m">'+T('c_'+c)+' · ⬇ '+(r.downloads||0)+(d?' · '+d:'')+(r.nick?' · '+T('by')+' '+esc(r.nick):'')+'</div>'+
  '<div class="acts"><button class="mini" data-a="fav" data-id="'+r.id+'">'+(f?T('faved'):T('fav'))+'</button><button class="mini" data-a="copy" data-id="'+r.id+'">'+T('copy')+'</button><button class="mini" data-a="rep" data-id="'+r.id+'">'+T('rep')+'</button>'+del+'</div></div>'+
  '<a class="dl" data-a="dl" data-id="'+r.id+'" href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">'+T('dl')+'</a></div>'}).join('')}
$('chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render()};
$('list').addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const r=rows.find(x=>x.id===b.dataset.id),a=b.dataset.a;if(!r||!db)return;
 try{
  if(a==='dl'){await updateDoc(doc(db,'links',r.id),{downloads:increment(1)})}
  else if(a==='copy'){try{await navigator.clipboard.writeText(r.url)}catch(x){const t=document.createElement('textarea');t.value=r.url;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast(T('copied'))}
  else if(a==='rep'){if(!confirm(T('qrep')))return;await updateDoc(doc(db,'links',r.id),{reports:increment(1)});toast(T('reps'))}
  else if(a==='del'){if(!confirm(T('qdel')))return;await deleteDoc(doc(db,'links',r.id));toast(T('dels'))}
  else if(a==='fav'){if(!me){toast(T('nologin'));return}
   favs=favs.includes(r.id)?favs.filter(x=>x!==r.id):favs.concat(r.id);render();
   await setDoc(doc(db,'users',me.uid),{favs},{merge:true})}
 }catch(x){toast(T('err'))}
});
$('q').oninput=render;$('sort').onchange=render;$('view').onchange=render;
$('send').onclick=async()=>{
 const u=$('url').value.trim(),t=$('title').value.trim();
 if(!validMF(u)){say(T('bad'),true);return}
 if(!col){say(T('cfg'),true);return}
 if(rows.some(r=>r.url===u)){say(T('dup'),true);return}
 const title=(t||nameFromUrl(u)).slice(0,120);let c=$('cat').value;if(c==='auto')c=guess(title);
 $('send').disabled=true;
 try{await addDoc(col,{url:u,title,cat:c,downloads:0,reports:0,uid:uid(),nick:dispName()||null,createdAt:Date.now()});
  $('url').value='';$('title').value='';say(T('ok'));$('addBox').open=false}
 catch(e){say(T('err'),true)}
 $('send').disabled=false};
/* configurações */
$('acc').onclick=()=>{$('nick').value=prof.nick||'';$('pmsg').textContent='';authUI();$('ov').classList.add('on')};
$('x').onclick=()=>$('ov').classList.remove('on');
$('ov').onclick=e=>{if(e.target===$('ov'))$('ov').classList.remove('on')};
$('th').onchange=()=>{pref=$('th').value;try{localStorage.setItem('lf-theme',pref)}catch(e){}applyTheme()};
$('lg').onchange=()=>{lang=$('lg').value;try{localStorage.setItem('lf-lang',lang)}catch(e){}applyLang()};
$('photo').onchange=function(){
 const f=this.files&&this.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=112;
  c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,112,112);prof.photo=c.toDataURL('image/jpeg',.75);URL.revokeObjectURL(u);avatar()};
 im.src=u};
$('savep').onclick=async()=>{
 if(!me){$('pmsg').textContent=T('nologin');return}
 prof.nick=$('nick').value.trim().slice(0,24);
 try{await setDoc(doc(db,'users',me.uid),{nick:prof.nick,photo:prof.photo||null},{merge:true});$('pmsg').textContent=T('psaved');greet();avatar()}
 catch(e){$('pmsg').textContent=T('err')}};
/* iniciar */
applyLang();
if(firebaseConfig.apiKey&&firebaseConfig.apiKey!=='COLE_AQUI'){
 const app=initializeApp(firebaseConfig);db=getFirestore(app);auth=getAuth(app);col=collection(db,'links');
 onSnapshot(query(col,orderBy('createdAt','desc'),limit(500)),s=>{
  rows=s.docs.map(d=>({...d.data(),id:d.id})).filter(r=>r.url&&validMF(r.url));ready=true;render()},()=>{ready=true;render()});
 onAuthStateChanged(auth,async u=>{
  me=u;favs=[];prof={};
  if(u){try{const d=await getDoc(doc(db,'users',u.uid));const x=d.exists()?d.data():{};favs=x.favs||[];prof={nick:x.nick||'',photo:x.photo||null}}catch(e){}}
  avatar();authUI();greet();render()});
}
avatar();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
